<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Aura Soaps</title>
  <meta name="description" content="The page you are looking for might have been moved or removed. Search Aura Soaps or return to our homepage.">
  <meta name="author" content="Aura Soaps">
  
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-aura" id="mainNavbar">
      <div class="container-custom d-flex align-items-center justify-content-between">
        <a class="navbar-brand-aura" href="index.html">
          <img src="assets/images/logo.png" alt="Aura Soaps" class="brand-logo-img">
        </a>
        <div class="d-flex align-items-center gap-3">
          <a href="index.html" class="btn-aura-outline py-2 px-3 fs-8"><i class="fas fa-home me-1"></i> Return Home</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-6 min-vh-100 d-flex align-items-center bg-section">
    <div class="container-custom">
      <div class="status-card">
        <div class="status-icon-box">
          <i class="fas fa-seedling text-primary-green"></i>
        </div>
        <span class="badge-subtitle mb-2">Error 404</span>
        <h1 class="font-heading display-3 fw-bold text-dark mb-3">Oops! Page Lost In Nature</h1>
        <p class="text-muted-custom fs-5 max-w-600 mx-auto mb-4">
          The page or product link you clicked might have been moved or updated. Let's get you back on the right botanical path!
        </p>

        <!-- Search Bar -->
        <div class="search-box-aura mb-5">
          <form action="search.html" method="GET">
            <i class="fas fa-search search-box-icon"></i>
            <input type="text" name="q" class="search-input-aura" placeholder="Search for soaps, ingredients, or articles...">
          </form>
        </div>

        <!-- Quick Links -->
        <div class="d-flex flex-wrap justify-content-center gap-3">
          <a href="index.html" class="btn-aura-primary">
            <span>Back To Homepage</span>
            <i class="fas fa-home"></i>
          </a>
          <a href="products.html" class="btn-aura-outline">
            <span>Explore All Products</span>
            <i class="fas fa-box-open"></i>
          </a>
          <a href="contact.html" class="btn-aura-ghost">
            <span>Contact Support</span>
            <i class="fas fa-envelope"></i>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-aura">
    <div class="container-custom">
      <div class="footer-bottom d-flex justify-content-between text-white-50">
        <div>&copy; 2026 Aura Soaps. All Rights Reserved.</div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
